[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lnp-agent"
version = "0.1.0"
description = "Closed-loop active learning for lipid nanoparticle formulation design."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "LNPAgent contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "rdkit>=2023.9",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
gpu = ["xgboost>=2.0", "torch>=2.1"]
llm = ["accelerate>=0.25", "torch>=2.1", "transformers>=4.45"]
agile = ["torch>=2.1", "torch-geometric>=2.4"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
lnp-agent = "lnp_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
