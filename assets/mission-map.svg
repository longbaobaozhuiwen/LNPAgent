<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">LNPAgent mission map</title>
  <desc id="desc">A high-level map showing closed-loop LNP design, scientific guardrails, and public data boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1320"/><stop offset="1" stop-color="#17324d"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#37c6a4"/><stop offset="1" stop-color="#6aa9ff"/></linearGradient>
  </defs>
  <rect width="1100" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="930" cy="80" r="155" fill="#37c6a4" opacity="0.10"/>
  <circle cx="150" cy="350" r="120" fill="#6aa9ff" opacity="0.10"/>
  <text x="64" y="74" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">LNPAgent</text>
  <text x="64" y="112" fill="#c8d8e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Auditable closed-loop active learning for LNP formulation design</text>
  <rect x="64" y="160" width="250" height="150" rx="18" fill="#101d2f" stroke="#2a4864"/>
  <rect x="425" y="160" width="250" height="150" rx="18" fill="#101d2f" stroke="#2a4864"/>
  <rect x="786" y="160" width="250" height="150" rx="18" fill="#101d2f" stroke="#2a4864"/>
  <text x="92" y="202" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Design Loop</text>
  <text x="92" y="235" fill="#c8d8e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Generate, predict, select,</text>
  <text x="92" y="258" fill="#c8d8e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">measure, retrain, repeat.</text>
  <path d="M112 285 C150 320, 236 320, 268 282" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M268 282 l-24 -2 l15 -18" fill="none" stroke="#6aa9ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="453" y="202" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Scientific Guardrails</text>
  <text x="453" y="235" fill="#c8d8e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Pareto review, uncertainty,</text>
  <text x="453" y="258" fill="#c8d8e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">group-aware validation.</text>
  <path d="M470 286 L510 250 L548 268 L594 220 L636 244" fill="none" stroke="url(#accent)" stroke-width="4"/>
  <text x="814" y="202" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Public Boundary</text>
  <text x="814" y="235" fill="#c8d8e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Public example data only.</text>
  <text x="814" y="258" fill="#c8d8e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Private data stays out of Git.</text>
  <rect x="820" y="278" width="85" height="26" rx="13" fill="#37c6a4" opacity="0.20" stroke="#37c6a4"/>
  <text x="838" y="296" fill="#bfffee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">PUBLIC</text>
  <rect x="918" y="278" width="90" height="26" rx="13" fill="#ff6b6b" opacity="0.15" stroke="#ff9b9b"/>
  <text x="938" y="296" fill="#ffd0d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">PRIVATE</text>
  <path d="M324 235 H400" stroke="#6aa9ff" stroke-width="4" stroke-linecap="round"/><path d="M388 222 L404 235 L388 248" fill="none" stroke="#6aa9ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M685 235 H761" stroke="#6aa9ff" stroke-width="4" stroke-linecap="round"/><path d="M749 222 L765 235 L749 248" fill="none" stroke="#6aa9ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="366" fill="#a9bdd2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Goal: reusable scientific infrastructure, not an unreviewed black-box formulation recommender.</text>
</svg>

