<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Public release boundary for LNPAgent</title>
  <desc id="desc">A diagram separating approved public repository content from private measurements, checkpoints, generated artifacts, and secrets that must stay out of Git.</desc>
  <defs>
    <linearGradient id="left" x1="0" x2="1"><stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <linearGradient id="right" x1="0" x2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#fef2f2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#334155" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1280" height="520" rx="32" fill="#f8fafc"/>
  <text x="64" y="64" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="900">Public by design, strict by boundary</text>
  <text x="64" y="100" fill="#526176" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">The repository can be open only because public examples, generated artifacts, and private measurements are separated.</text>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="70" y="150" width="500" height="286" rx="24" fill="url(#left)" stroke="#86efac"/>
    <rect x="710" y="150" width="500" height="286" rx="24" fill="url(#right)" stroke="#fca5a5"/>
  </g>
  <line x1="640" y1="142" x2="640" y2="452" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 12"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="320" y="198" text-anchor="middle" fill="#065f46" font-size="25" font-weight="900">Allowed in Git</text>
    <text x="960" y="198" text-anchor="middle" fill="#991b1b" font-size="25" font-weight="900">Keep out of Git</text>
    <g fill="#0f172a" font-size="17">
      <text x="122" y="248">+ documented public LNPDB example</text>
      <text x="122" y="286">+ provenance and license notice</text>
      <text x="122" y="324">+ source code, tests, docs, diagrams</text>
      <text x="122" y="362">+ public schema and coverage artifacts</text>
      <text x="122" y="400">+ synthetic fixtures clearly labelled as simulation</text>
    </g>
    <g fill="#0f172a" font-size="17">
      <text x="762" y="248">- confidential or unpublished measurements</text>
      <text x="762" y="286">- proprietary formulation records</text>
      <text x="762" y="324">- local checkpoints, weights, and run outputs</text>
      <text x="762" y="362">- credentials, tokens, or API keys</text>
      <text x="762" y="400">- restricted third-party datasets</text>
    </g>
    <rect x="500" y="456" width="280" height="38" rx="19" fill="#0f172a"/>
    <text x="640" y="481" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">audit before every public release</text>
  </g>
</svg>
