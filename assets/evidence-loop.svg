<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">LNPAgent evidence loop</title>
  <desc id="desc">A visual summary of the LNPAgent closed loop from formulation generation through prediction, selection, evidence capture, and model update.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111f"/><stop offset="1" stop-color="#123044"/></linearGradient>
    <linearGradient id="agent" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="warm" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity=".42"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10z" fill="#93c5fd"/></marker>
  </defs>
  <rect width="1280" height="560" rx="34" fill="url(#bg)"/>
  <path d="M146 380C130 220 250 116 410 110C500 54 650 56 734 116C904 110 1034 230 1018 394C922 498 736 488 646 440C534 504 344 500 242 414C206 414 172 402 146 380Z" fill="#0f2638" stroke="#214862" stroke-width="2"/>
  <circle cx="640" cy="282" r="104" fill="url(#agent)" filter="url(#shadow)"/>
  <text x="640" y="260" text-anchor="middle" fill="#06111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="900">LNPAgent</text>
  <text x="640" y="292" text-anchor="middle" fill="#06111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">evidence-driven</text>
  <text x="640" y="318" text-anchor="middle" fill="#06111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">experiment policy</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(82 146)"><rect width="236" height="110" rx="20" fill="#10263a" stroke="#37627f"/><text x="118" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="850">Generate</text><text x="118" y="72" text-anchor="middle" fill="#bdd7e9" font-size="15">building blocks</text><text x="118" y="94" text-anchor="middle" fill="#bdd7e9" font-size="15">and ratio rules</text></g>
    <g transform="translate(88 340)"><rect width="244" height="112" rx="20" fill="#10263a" stroke="#37627f"/><text x="122" y="43" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="850">Predict</text><text x="122" y="73" text-anchor="middle" fill="#bdd7e9" font-size="15">multi-endpoint</text><text x="122" y="95" text-anchor="middle" fill="#bdd7e9" font-size="15">baseline models</text></g>
    <g transform="translate(958 146)"><rect width="236" height="110" rx="20" fill="#10263a" stroke="#37627f"/><text x="118" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="850">Select</text><text x="118" y="72" text-anchor="middle" fill="#bdd7e9" font-size="15">Pareto trade-offs</text><text x="118" y="94" text-anchor="middle" fill="#bdd7e9" font-size="15">and uncertainty</text></g>
    <g transform="translate(944 340)"><rect width="264" height="112" rx="20" fill="#10263a" stroke="#37627f"/><text x="132" y="43" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="850">Learn</text><text x="132" y="73" text-anchor="middle" fill="#bdd7e9" font-size="15">new measurements</text><text x="132" y="95" text-anchor="middle" fill="#bdd7e9" font-size="15">or synthetic fixtures</text></g>
  </g>
  <g fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)">
    <path d="M318 201C420 166 500 179 560 226"/>
    <path d="M726 226C790 178 864 165 958 201"/>
    <path d="M1070 256C1104 296 1105 330 1070 340"/>
    <path d="M944 392C832 456 742 444 686 376"/>
    <path d="M594 376C520 450 424 454 332 392"/>
    <path d="M207 340C172 300 174 266 200 256"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="62" y="72" fill="#ffffff" font-size="34" font-weight="900">Closed-loop LNP design under uncertainty</text>
    <text x="62" y="108" fill="#b7cfe4" font-size="17">The agent optimizes experiment value, evidence quality, and safe provenance boundaries in every round.</text>
    <rect x="420" y="462" width="438" height="46" rx="23" fill="url(#warm)" opacity=".92"/>
    <text x="639" y="492" text-anchor="middle" fill="#1f1300" font-size="16" font-weight="850">Informative next experiments beat blind score chasing</text>
  </g>
</svg>
