<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Release ladder from v0.8.0 to v0.16.0</title>
  <desc id="desc">Timeline showing public release improvements from data summary through audit publication.</desc>
  <rect width="1100" height="390" rx="24" fill="#101828"/>
  <text x="56" y="58" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Public release ladder</text>
  <text x="56" y="88" fill="#b8c4d4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Each rung removed ambiguity from the open-source workflow.</text>
  <line x1="90" y1="205" x2="1010" y2="205" stroke="#33465f" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(90 0)"><circle cy="205" r="18" fill="#37c6a4"/><text y="250" fill="#ffffff" font-size="14" font-weight="700">v0.8</text><text y="278" fill="#aebcd0" font-size="12">Public summary</text></g>
    <g transform="translate(205 0)"><circle cy="205" r="18" fill="#37c6a4"/><text y="250" fill="#ffffff" font-size="14" font-weight="700">v0.9</text><text y="278" fill="#aebcd0" font-size="12">Synthetic labels</text></g>
    <g transform="translate(320 0)"><circle cy="205" r="18" fill="#6aa9ff"/><text y="250" fill="#ffffff" font-size="14" font-weight="700">v0.10</text><text y="278" fill="#aebcd0" font-size="12">Candidate UQ</text></g>
    <g transform="translate(435 0)"><circle cy="205" r="18" fill="#6aa9ff"/><text y="250" fill="#ffffff" font-size="14" font-weight="700">v0.11</text><text y="278" fill="#aebcd0" font-size="12">Robust Pareto</text></g>
    <g transform="translate(550 0)"><circle cy="205" r="18" fill="#f8c14a"/><text y="250" fill="#ffffff" font-size="14" font-weight="700">v0.12</text><text y="278" fill="#aebcd0" font-size="12">Data contract</text></g>
    <g transform="translate(665 0)"><circle cy="205" r="18" fill="#f8c14a"/><text y="250" fill="#ffffff" font-size="14" font-weight="700">v0.13</text><text y="278" fill="#aebcd0" font-size="12">Group CV</text></g>
    <g transform="translate(780 0)"><circle cy="205" r="18" fill="#d58cff"/><text y="250" fill="#ffffff" font-size="14" font-weight="700">v0.14</text><text y="278" fill="#aebcd0" font-size="12">Benchmark CLI</text></g>
    <g transform="translate(895 0)"><circle cy="205" r="18" fill="#d58cff"/><text y="250" fill="#ffffff" font-size="14" font-weight="700">v0.15</text><text y="278" fill="#aebcd0" font-size="12">Provenance</text></g>
    <g transform="translate(1010 0)"><circle cy="205" r="18" fill="#ffffff"/><text y="250" fill="#ffffff" font-size="14" font-weight="700">v0.16</text><text y="278" fill="#aebcd0" font-size="12">Audit</text></g>
  </g>
  <rect x="56" y="324" width="988" height="34" rx="17" fill="#18263a"/>
  <text x="80" y="346" fill="#dce8f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Outcome: public data workflow, explicit simulation boundary, safer validation, provenance, and a durable research log.</text>
</svg>

