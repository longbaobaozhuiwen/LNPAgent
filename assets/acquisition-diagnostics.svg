<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">LNPAgent acquisition diagnostics</title>
  <desc id="desc">A visual summary of acquisition diagnostics that connect predicted score, uncertainty, diversity, rationale counts, and public assay diagnostics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#12243a"/>
      <stop offset="1" stop-color="#102a2b"/>
    </linearGradient>
    <linearGradient id="score" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="560" rx="32" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="72" fill="#ffffff" font-size="36" font-weight="900">Acquisition is a decision, not just a ranking</text>
    <text x="64" y="112" fill="#b9c9d8" font-size="18">The public demo exposes why each selected candidate entered the batch.</text>

    <g filter="url(#shadow)">
      <rect x="74" y="158" width="300" height="314" rx="24" fill="#0f1f33" stroke="#294967"/>
      <rect x="490" y="158" width="300" height="314" rx="24" fill="#0f1f33" stroke="#294967"/>
      <rect x="906" y="158" width="300" height="314" rx="24" fill="#0f1f33" stroke="#294967"/>
    </g>

    <text x="224" y="205" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="900">Exploit</text>
    <text x="224" y="232" text-anchor="middle" fill="#9fb4ca" font-size="15">multi-endpoint objective score</text>
    <path d="M122 394 C162 330, 190 346, 225 282 C264 211, 310 244, 337 202" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round"/>
    <circle cx="225" cy="282" r="10" fill="#ffffff"/>
    <circle cx="337" cy="202" r="10" fill="#5eead4"/>
    <rect x="126" y="422" width="196" height="18" rx="9" fill="#1e3a5f"/>
    <rect x="126" y="422" width="145" height="18" rx="9" fill="url(#score)"/>

    <text x="640" y="205" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="900">Explore</text>
    <text x="640" y="232" text-anchor="middle" fill="#9fb4ca" font-size="15">uncertainty and under-sampled regions</text>
    <g fill="none" stroke-width="3">
      <circle cx="586" cy="306" r="42" stroke="#60a5fa"/>
      <circle cx="684" cy="314" r="62" stroke="#fbbf24"/>
      <circle cx="635" cy="360" r="86" stroke="#5eead4" opacity=".65"/>
    </g>
    <g fill="#ffffff">
      <circle cx="584" cy="301" r="8"/>
      <circle cx="620" cy="382" r="8"/>
      <circle cx="697" cy="310" r="8"/>
      <circle cx="665" cy="247" r="8"/>
      <circle cx="704" cy="403" r="8"/>
    </g>

    <text x="1056" y="205" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="900">Explain</text>
    <text x="1056" y="232" text-anchor="middle" fill="#9fb4ca" font-size="15">diagnostics recorded with provenance</text>
    <g font-size="15" font-weight="800">
      <rect x="982" y="268" width="148" height="28" rx="14" fill="#123c3d"/>
      <text x="1056" y="288" text-anchor="middle" fill="#9ff6e4">score vs assay</text>
      <rect x="958" y="314" width="196" height="28" rx="14" fill="#17345a"/>
      <text x="1056" y="334" text-anchor="middle" fill="#bfdbfe">selected vs pool</text>
      <rect x="972" y="360" width="168" height="28" rx="14" fill="#3b2b16"/>
      <text x="1056" y="380" text-anchor="middle" fill="#fde68a">lipid diversity</text>
      <rect x="982" y="406" width="148" height="28" rx="14" fill="#2d1f45"/>
      <text x="1056" y="426" text-anchor="middle" fill="#ddd6fe">rationales</text>
    </g>

    <path d="M386 315 L466 315" stroke="#75b7ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M454 300 L472 315 L454 330" fill="none" stroke="#75b7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M802 315 L882 315" stroke="#75b7ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M870 300 L888 315 L870 330" fill="none" stroke="#75b7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="310" y="500" width="660" height="34" rx="17" fill="#07111f" stroke="#1d3a55"/>
    <text x="640" y="522" text-anchor="middle" fill="#d8e8f7" font-size="15" font-weight="800">Every public artifact carries measurement type, source, license, and private_data_included=false</text>
  </g>
</svg>

