<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">LNPAgent core innovation</title>
  <desc id="desc">An agentic active-learning loop that connects formulation generation, multi-endpoint prediction, uncertainty-aware experiment selection, measurement, and model updating.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#152b3d"/></linearGradient>
    <linearGradient id="agent" x1="0" x2="1"><stop offset="0" stop-color="#44d7b6"/><stop offset="1" stop-color="#6ca8ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#75b7ff"/></marker>
  </defs>
  <rect width="1180" height="520" rx="30" fill="url(#background)"/>
  <text x="60" y="68" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">From prediction pipeline to experimental decision agent</text>
  <text x="60" y="104" fill="#b9c9d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">The innovation target is the policy that decides what to test next, not just another endpoint regressor.</text>
  <circle cx="590" cy="280" r="96" fill="url(#agent)" opacity="0.95"/>
  <text x="590" y="260" text-anchor="middle" fill="#07111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900">LNPAgent</text>
  <text x="590" y="290" text-anchor="middle" fill="#07111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">active-learning</text>
  <text x="590" y="314" text-anchor="middle" fill="#07111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">decision policy</text>
  <rect x="70" y="190" width="230" height="82" rx="18" fill="#101d2c" stroke="#2c4963"/>
  <text x="185" y="223" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Formulation space</text>
  <text x="185" y="250" text-anchor="middle" fill="#b9c9d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">building blocks + ratios</text>
  <rect x="70" y="330" width="230" height="82" rx="18" fill="#101d2c" stroke="#2c4963"/>
  <text x="185" y="363" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Evidence memory</text>
  <text x="185" y="390" text-anchor="middle" fill="#b9c9d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">what each round taught</text>
  <rect x="880" y="190" width="230" height="82" rx="18" fill="#101d2c" stroke="#2c4963"/>
  <text x="995" y="223" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Assay objectives</text>
  <text x="995" y="250" text-anchor="middle" fill="#b9c9d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">delivery, inflammation, safety</text>
  <rect x="880" y="330" width="230" height="82" rx="18" fill="#101d2c" stroke="#2c4963"/>
  <text x="995" y="363" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Next experiment</text>
  <text x="995" y="390" text-anchor="middle" fill="#b9c9d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">exploit + explore batch</text>
  <path d="M300 231 C385 205, 455 220, 500 250" fill="none" stroke="#75b7ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M500 316 C440 378, 360 385, 300 371" fill="none" stroke="#75b7ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M680 250 C735 214, 810 207, 880 231" fill="none" stroke="#75b7ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M880 371 C804 390, 735 375, 680 316" fill="none" stroke="#75b7ff" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="400" y="430" width="380" height="44" rx="22" fill="#20344a" stroke="#355878"/>
  <text x="590" y="458" text-anchor="middle" fill="#d8e8f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Optimize experiment value under uncertainty, not only predicted score</text>
</svg>
