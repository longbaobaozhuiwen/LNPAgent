<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">LNPAgent autonomous design workflow</title>
  <desc id="desc">A closed-loop agent workflow moving from a design brief through candidate generation, prediction, review, experimental feedback, and model updates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071529"/><stop offset="1" stop-color="#112e4c"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173d61"/><stop offset="1" stop-color="#0d263f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#010916" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#78d8ff"/></marker>
  </defs>
  <rect width="1440" height="620" fill="url(#bg)"/>
  <circle cx="118" cy="95" r="180" fill="#1676a8" opacity=".16"/><circle cx="1300" cy="530" r="220" fill="#7254db" opacity=".15"/>
  <text x="720" y="75" fill="#f3fbff" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="38" text-anchor="middle">LNPAgent: autonomous closed-loop design</text>
  <text x="720" y="110" fill="#a9c9df" font-family="Inter,Arial,sans-serif" font-size="19" text-anchor="middle">A transparent workflow for planning, ranking, evidence capture, and iterative learning</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(78 220)"><rect width="210" height="178" rx="22" fill="url(#card)" stroke="#4aaee0"/><circle cx="40" cy="41" r="20" fill="#143f61" stroke="#78d8ff"/><text x="40" y="48" fill="#c9f0ff" font-weight="700" font-size="18" text-anchor="middle">1</text><text x="28" y="94" fill="#f6fbff" font-weight="700" font-size="22">Plan</text><text x="28" y="124" fill="#b7d3e5" font-size="16">Translate goals into</text><text x="28" y="148" fill="#b7d3e5" font-size="16">an auditable protocol</text></g>
    <g transform="translate(345 220)"><rect width="210" height="178" rx="22" fill="url(#card)" stroke="#4aaee0"/><circle cx="40" cy="41" r="20" fill="#143f61" stroke="#78d8ff"/><text x="40" y="48" fill="#c9f0ff" font-weight="700" font-size="18" text-anchor="middle">2</text><text x="28" y="94" fill="#f6fbff" font-weight="700" font-size="22">Generate</text><text x="28" y="124" fill="#b7d3e5" font-size="16">Build and validate a</text><text x="28" y="148" fill="#b7d3e5" font-size="16">candidate library</text></g>
    <g transform="translate(612 220)"><rect width="210" height="178" rx="22" fill="url(#card)" stroke="#4aaee0"/><circle cx="40" cy="41" r="20" fill="#143f61" stroke="#78d8ff"/><text x="40" y="48" fill="#c9f0ff" font-weight="700" font-size="18" text-anchor="middle">3</text><text x="28" y="94" fill="#f6fbff" font-weight="700" font-size="22">Rank</text><text x="28" y="124" fill="#b7d3e5" font-size="16">Score performance and</text><text x="28" y="148" fill="#b7d3e5" font-size="16">uncertainty together</text></g>
    <g transform="translate(879 220)"><rect width="210" height="178" rx="22" fill="url(#card)" stroke="#4aaee0"/><circle cx="40" cy="41" r="20" fill="#143f61" stroke="#78d8ff"/><text x="40" y="48" fill="#c9f0ff" font-weight="700" font-size="18" text-anchor="middle">4</text><text x="28" y="94" fill="#f6fbff" font-weight="700" font-size="22">Review</text><text x="28" y="124" fill="#b7d3e5" font-size="16">Report decisions and</text><text x="28" y="148" fill="#b7d3e5" font-size="16">capture evidence</text></g>
    <g transform="translate(1146 220)"><rect width="210" height="178" rx="22" fill="url(#card)" stroke="#4aaee0"/><circle cx="40" cy="41" r="20" fill="#143f61" stroke="#78d8ff"/><text x="40" y="48" fill="#c9f0ff" font-weight="700" font-size="18" text-anchor="middle">5</text><text x="28" y="94" fill="#f6fbff" font-weight="700" font-size="22">Learn</text><text x="28" y="124" fill="#b7d3e5" font-size="16">Ingest measurements</text><text x="28" y="148" fill="#b7d3e5" font-size="16">and update the model</text></g>
  </g>
  <g stroke="#78d8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M288 309H333"/><path d="M555 309H600"/><path d="M822 309H867"/><path d="M1089 309H1134"/><path d="M1251 411C1188 550 313 550 185 411"/></g>
  <text x="720" y="558" fill="#91c9e8" font-family="Inter,Arial,sans-serif" font-size="17" text-anchor="middle">Each cycle preserves human review points, provenance, and safe experiment boundaries.</text>
</svg>
